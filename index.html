<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Level Up: Dungeon Master</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dungeon Master">
<meta name="theme-color" content="#0f0b18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
/* Layout: één kolom "systeemvenster" op telefoonbreedte, vaste tabbalk onderin. Bewust één donkere wereld. */
:root{
  --void:#0f0b18;
  --panel:#1a1630;
  --panel-2:#241d3e;
  --line:#e8c25a;
  --line-dim:#6e5428;
  --ink:#f3e9d2;
  --muted:#b9a98a;
  --gold:#ffd76a;
  --violet:#a88cff;
  --red:#e0564a;
  --ok:#6fd08a;
  --cat-beweging:#e0564a;
  --cat-community:#6fd08a;
  --cat-interactie:#f08ac0;
  --cat-mindfulness:#a88cff;
  --cat-yoga:#4fc8c0;
  --f-sys:"Pixelify Sans","Courier New",monospace;
  --f-px:"Press Start 2P","Courier New",monospace;
  --f-body:"Pixelify Sans","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(61,180,255,.16),transparent 60%),repeating-linear-gradient(0deg,rgba(61,180,255,.035) 0 1px,transparent 1px 4px);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--void)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}

/* Systeemvenster */
.win{position:relative;background:linear-gradient(180deg,rgba(12,26,51,.92),rgba(8,19,38,.92));border:1px solid var(--line-dim);box-shadow:0 0 0 1px rgba(61,180,255,.08) inset,0 0 24px rgba(61,180,255,.12);padding:14px}
.win::before,.win::after{content:"";position:absolute;width:12px;height:12px;border:2px solid var(--line)}
.win::before{top:-2px;left:-2px;border-right:0;border-bottom:0}
.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.sys-label{font-family:var(--f-sys);font-weight:600;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--line)}
h1,h2,h3{font-family:var(--f-sys);margin:0;text-wrap:balance;letter-spacing:.04em}
h2{font-size:20px}
.muted{color:var(--muted)}

/* Header */
.hud{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.rank-badge{width:54px;height:54px;display:grid;place-items:center;font-family:var(--f-sys);font-weight:700;font-size:28px;color:var(--rank,var(--line));border:2px solid var(--rank,var(--line));transform:rotate(45deg);box-shadow:0 0 16px var(--rank,var(--line)) inset,0 0 12px color-mix(in srgb,var(--rank,var(--line)) 50%,transparent)}
.rank-badge span{transform:rotate(-45deg);text-shadow:0 0 10px var(--rank,var(--line))}
.hud-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.hud-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud-name{font-family:var(--f-sys);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-lvl{font-family:var(--f-sys);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.hud-lvl b{color:var(--ink);font-size:18px}
.bar{height:8px;background:#0a1222;border:1px solid var(--line-dim);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1b6fd6,var(--line));box-shadow:0 0 10px var(--line);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.hud-sub{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.streak{color:var(--gold)}

/* Quests */
.today-head{display:flex;justify-content:space-between;align-items:end;gap:10px}
.today-head h2{font-size:22px}
.timer{font-family:var(--f-sys);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.timer b{display:block;color:var(--red);font-size:16px}
.notice{border-color:rgba(255,77,106,.5);box-shadow:0 0 22px rgba(255,77,106,.15)}
.notice .sys-label{color:var(--red)}
.qlist{display:flex;flex-direction:column;gap:10px}
.q{--c:var(--line);position:relative;text-align:left;width:100%;display:flex;flex-direction:column;gap:8px;padding:12px 12px 12px 14px;background:rgba(8,19,38,.85);border:1px solid #16304f;transition:border-color .2s,box-shadow .2s,transform .15s}
.q[data-cat="community"]{--c:var(--cat-community)}
.q[data-cat="interactie"]{--c:var(--cat-interactie)}
.q[data-cat="mindfulness"]{--c:var(--cat-mindfulness)}
.q[data-cat="yoga"]{--c:var(--cat-yoga)}
.q::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;background:var(--c);box-shadow:0 0 8px var(--c)}
button.q:active{transform:scale(.985)}
.q.sel{border-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 30%,transparent),0 0 0 1px var(--c) inset}
.q.hidden-q{border-color:rgba(255,207,92,.6);background:linear-gradient(135deg,rgba(255,207,92,.08),rgba(8,19,38,.9) 50%)}
.q.done{opacity:.62}
.q-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-sys);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.q-cat{color:var(--c)}
.q-stat{color:var(--muted)}
.q-xp{margin-left:auto;color:var(--gold);font-size:13px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.q-text{font-size:16px;font-weight:500;line-height:1.35}
.q-hint{font-size:13px;color:var(--muted)}
.q-check{position:absolute;right:10px;bottom:10px;width:22px;height:22px;border:1.5px solid var(--line-dim);display:grid;place-items:center;font-family:var(--f-sys);font-size:14px;color:var(--void)}
.q.sel .q-check{background:var(--c);border-color:var(--c)}
.hidden-tag{color:var(--gold)}
.counter{display:flex;flex-direction:column;gap:8px}
.counter-row{display:flex;align-items:center;gap:6px}
.count-num{font-family:var(--f-sys);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;min-width:0;flex:1}
.count-num small{font-size:13px;color:var(--muted)}
.cbtn{min-width:44px;height:40px;padding:0 10px;border:1px solid var(--line-dim);background:var(--panel-2);font-family:var(--f-sys);font-weight:600;font-size:14px}
.cbtn:active{background:#123059}
.cbar i{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 50%,#000),var(--c));box-shadow:0 0 10px var(--c)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;font-family:var(--f-sys);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line);color:var(--ink);background:linear-gradient(180deg,rgba(61,180,255,.22),rgba(61,180,255,.06));box-shadow:0 0 16px rgba(61,180,255,.25)}
.btn:disabled{opacity:.35;box-shadow:none}
.btn.ghost{border-color:var(--line-dim);background:transparent;box-shadow:none;font-size:13px;min-height:42px}
.btn.gold{border-color:var(--gold);color:var(--gold);background:linear-gradient(180deg,rgba(255,207,92,.18),rgba(255,207,92,.04));box-shadow:0 0 16px rgba(255,207,92,.25)}
.btn.danger{border-color:var(--red);color:var(--red);background:transparent;box-shadow:none}
.btn-done{min-height:42px;font-size:13px}
.actions{display:flex;gap:10px}
.actions>*{flex:1}
.choose-bar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;gap:8px;padding:10px;background:rgba(4,6,12,.9);backdrop-filter:blur(8px);border:1px solid var(--line-dim)}
.choose-bar .row{display:flex;justify-content:space-between;font-family:var(--f-sys);font-size:13px;color:var(--muted);letter-spacing:.08em}
.complete-banner{text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.complete-banner h2{color:var(--ok);text-shadow:0 0 14px rgba(77,255,184,.5)}

/* Hunter */
.avatar-wrap{position:relative;display:grid;place-items:center;padding-block:4px}
.avatar-wrap svg{width:100%;max-width:300px;height:auto;overflow:visible}
.avatar-caption{text-align:center;display:flex;flex-direction:column;gap:2px}
.avatar-caption h2{font-size:22px}
.title-chip{display:inline-block;font-family:var(--f-sys);font-size:12px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase}
.stats{display:flex;flex-direction:column;gap:10px}
.stat{display:grid;grid-template-columns:96px 1fr 38px 40px;gap:8px;align-items:center}
.stat-name{font-family:var(--f-sys);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.stat-name small{display:block;font-family:var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);font-size:11px}
.stat-val{font-family:var(--f-sys);font-weight:700;font-size:17px;text-align:right;font-variant-numeric:tabular-nums}
.plus{width:40px;height:34px;border:1px solid var(--gold);color:var(--gold);font-family:var(--f-sys);font-size:18px}
.plus:disabled{opacity:.15;border-color:var(--line-dim);color:var(--muted)}
.free{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-sys);font-size:13px;letter-spacing:.1em}
.free b{color:var(--gold);font-size:18px}
.unlocks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.unlocks li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:14px}
.unlocks .r{font-family:var(--f-sys);font-weight:700;text-align:center;border:1px solid currentColor;padding:1px 0}
.unlocks li.got{color:var(--ink)}
.unlocks li.lock{color:#4d5f7f}
.titles{display:flex;flex-wrap:wrap;gap:6px}
.tchip{font-family:var(--f-sys);font-size:12px;letter-spacing:.08em;padding:6px 9px;border:1px solid var(--line-dim);color:#4d5f7f}
.tchip.on{border-color:var(--gold);color:var(--gold)}
.tchip.active{background:rgba(255,207,92,.15)}

/* Logboek */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:10px;border:1px solid #16304f;background:rgba(8,19,38,.7)}
.kpi b{font-family:var(--f-sys);font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.day{aspect-ratio:1;max-width:100%;border:1px solid #16304f;background:#060c18}
.day.p1{background:rgba(61,180,255,.25)}
.day.p2{background:rgba(61,180,255,.5)}
.day.p3{background:var(--line);box-shadow:0 0 8px var(--line)}
.day.today{outline:1px solid var(--gold);outline-offset:1px}
.log{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.log li{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid #10233d;font-size:14px}
.log li:last-child{border-bottom:0}
.log .dot{width:8px;height:8px;align-self:center}
.log .x{font-family:var(--f-sys);color:var(--gold);font-variant-numeric:tabular-nums;font-size:13px}
.log .d{display:block;color:var(--muted);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-family:var(--f-sys);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:#060c18;border:1px solid var(--line-dim);padding:10px 12px;border-radius:0}
textarea{min-height:80px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
input:focus,textarea:focus{outline:none;border-color:var(--line);box-shadow:0 0 10px rgba(61,180,255,.3)}
.stack{display:flex;flex-direction:column;gap:12px}
.small{font-size:13px}
.ex-term{color:inherit;text-decoration:underline;text-decoration-style:dotted;text-decoration-color:var(--c,var(--line));text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer;border-radius:3px}
.ex-term:hover,.ex-term:focus-visible{background:color-mix(in srgb,var(--c,var(--line)) 22%,transparent);outline:none}
.ex-hint{text-decoration:underline dotted var(--line) 2px;text-underline-offset:3px;color:var(--ink)}
.ex-win{max-width:400px!important;text-align:left!important}
.ex-win h2{font-size:22px}
.ex-stage{border:1px solid var(--line-dim);border-radius:6px;overflow:hidden;background:#060c18}
.ex-stage svg{display:block;width:100%;height:auto}
.ex-cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.45}
.watch-win{border-color:#2a4d72}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ring-btn{--rc:#ff375f;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid var(--line-dim);background:#060c18;font-family:var(--f-sys);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ring-btn.r-ex{--rc:#9cff3a}.ring-btn.r-stand{--rc:#2fe0ff}
.ring-dot{width:34px;height:34px;border-radius:50%;border:5px solid color-mix(in srgb,var(--rc) 28%,transparent);box-sizing:border-box}
.ring-btn.on{color:var(--ink);border-color:var(--rc);box-shadow:0 0 12px color-mix(in srgb,var(--rc) 35%,transparent)}
.ring-btn.on .ring-dot{border-color:var(--rc);box-shadow:0 0 10px var(--rc)}
.quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.quick input{width:100%;font:inherit;font-variant-numeric:tabular-nums;color:var(--ink);background:#060c18;border:1px solid var(--line-dim);padding:9px 8px;border-radius:0;min-width:0}
.quick .field{min-width:0}
.quick label{font-size:10px;white-space:nowrap}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:4px}
.stepper .cbtn{min-width:34px;height:40px;padding:0}
.stepper b{font-family:var(--f-sys);font-size:17px}
.watch-win .sys-label{white-space:nowrap}
.watch-btn{min-height:40px;padding:4px 10px;font-size:11px;letter-spacing:.06em;flex:0 1 auto;max-width:52%;white-space:normal;line-height:1.2;text-align:center}
.watch-win .today-head{align-items:center}
.watch-win .today-head>div{min-width:0}
.watch-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.watch-stats b{display:block;font-family:var(--f-sys);font-size:17px;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.wcode{font-size:13px;padding:8px 10px}
.watch-tag{color:#9fe8ff}
.watch-prog{display:flex;flex-direction:column;gap:5px}
.watch-row{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-sys);font-size:13px;color:#9fe8ff;font-variant-numeric:tabular-nums}
.watch-row b{color:var(--ok);letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.wbar i{background:linear-gradient(90deg,#1aa36a,var(--ok));box-shadow:0 0 10px var(--ok)}
.goal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.goal-grid input{width:100%;font:inherit;color:var(--ink);background:#060c18;border:1px solid var(--line-dim);padding:10px;border-radius:0}
.howto summary{font-family:var(--f-sys);font-size:13px;letter-spacing:.06em;color:var(--line);cursor:pointer;padding:6px 0}
.howto ol{margin:6px 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13px;line-height:1.5}
.howto code{font-size:11px;word-break:break-all;background:#060c18;border:1px solid var(--line-dim);padding:2px 4px;display:inline-block;margin-top:4px}
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gate{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:999px 999px 6px 6px;border:2px solid var(--line);overflow:hidden;background:#02040a;box-shadow:0 0 18px rgba(61,180,255,.4),inset 0 0 22px rgba(61,180,255,.5);transition:transform .15s}
.gate-core{position:absolute;inset:-35%;background:conic-gradient(from 0deg,#071a3d,#3db4ff,#0a1430,#9be2ff,#2a1a6a,#071a3d);filter:blur(7px);animation:spin 5s linear infinite;opacity:.9}
.gate::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 58%,rgba(255,255,255,.6),transparent 38%)}
.gate-lbl{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-family:var(--f-sys);font-weight:700;font-size:30px;color:#fff;text-shadow:0 0 12px var(--line)}
button.gate:active{transform:scale(.95)}
.gate.closed{border-style:dashed;border-color:var(--line-dim);box-shadow:none;opacity:.55}
.gate.closed .gate-lbl{font-size:20px;text-shadow:none}
.gate-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-family:var(--f-sys);letter-spacing:.06em}
.gate-legend i{display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:50%;vertical-align:-1px}
.gate-q{border-color:var(--c);box-shadow:0 0 20px color-mix(in srgb,var(--c) 35%,transparent)}
.gate-timer{font-family:var(--f-sys);font-size:13px;color:var(--red);letter-spacing:.06em}
.gate-timer b{font-variant-numeric:tabular-nums}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.seg button{min-height:40px;border:1px solid var(--line-dim);font-family:var(--f-sys);font-size:13px;letter-spacing:.06em;color:var(--muted)}
.seg button.on{border-color:var(--line);color:var(--ink);background:rgba(61,180,255,.18);box-shadow:0 0 10px rgba(61,180,255,.25)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

/* Tabbalk */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(4,6,12,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line-dim)}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:480px;gap:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-family:var(--f-sys);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6}
.tab[aria-selected="true"]{color:var(--line);text-shadow:0 0 8px var(--line)}
.tab[aria-selected="true"] svg{filter:drop-shadow(0 0 4px var(--line))}
.dotbadge{position:relative}
.dotbadge[data-n]::after{content:attr(data-n);position:absolute;top:-4px;right:-10px;min-width:16px;height:16px;padding:0 4px;background:var(--gold);color:var(--void);font-size:10px;line-height:16px;letter-spacing:0;border-radius:8px}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:rgba(2,4,9,.78);backdrop-filter:blur(4px)}
.overlay .win{width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:10px;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.overlay .big{font-family:var(--f-sys);font-weight:700;font-size:44px;line-height:1;color:var(--line);text-shadow:0 0 18px var(--line)}
.overlay .big.gold{color:var(--gold);text-shadow:0 0 18px var(--gold)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const dkey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(k,n)=>{const [y,m,d]=k.split("-").map(Number);return dkey(new Date(y,m-1,d+n));};
function hash(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return h>>>0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const needXp=l=>80+20*l;
const rankIdx=l=>{let i=0;RANKS.forEach((r,j)=>{if(l>=r.min)i=j;});return i;};
const tierOf=l=>Math.min(3,rankIdx(l));
const fmt=n=>n.toLocaleString("nl-NL");

/* ===================== DAGLOGICA ===================== */
function genOffer(date,salt){
  const r=rng(hash(date+"|"+S.name+"|"+salt));
  const recent=new Set();S.history.slice(-12).forEach(h=>h.ids.forEach(i=>recent.add(i)));
  const tier=tierOf(S.level);
  const [yy,mm,dd]=date.split("-").map(Number);const office=S.settings.office!=null&&new Date(yy,mm-1,dd).getDay()===S.settings.office;
  const okDay=q=>!q.o||office;
  const pick=(cat,k,only,meas)=>{const base=POOL.filter(q=>q.cat===cat&&okDay(q)&&(!only||q.o)&&(!q.w||S.settings.watch)&&(!meas||q.m));let c=base.filter(q=>!recent.has(q.id));if(c.length<k)c=base.slice();
    const out=[];while(out.length<k&&c.length){out.push(c.splice(Math.floor(r()*c.length),1)[0]);}return out;};
  // Kantoordag: één interactiequest is gegarandeerd een kantoorquest
  const offI=office?pick(I,1,true):[];offI.forEach(q=>recent.add(q.id));
  let bw=[];if(S.settings.watch){bw=pick(B,1,false,true);bw.forEach(q=>recent.add(q.id));}
  // 7 kaarten: 2 beweging, 1 per andere categorie, plus 1 extra in een willekeurige categorie
  const extra=[Y,M,C,I][Math.floor(r()*4)],nb=k=>extra===k?2:1;
  const tpls=[...bw,...pick(B,2-bw.length),...pick(Y,nb(Y)),...pick(M,nb(M)),...pick(C,nb(C)),...offI,...pick(I,Math.max(0,nb(I)-offI.length))];
  // schudden
  for(let i=tpls.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[tpls[i],tpls[j]]=[tpls[j],tpls[i]];}
  const hiddenAt=r()<0.14?Math.floor(r()*7):-1;
  return tpls.map((t,i)=>{
    let n=t.goal?S.settings[t.goal]:t.n?t.n[tier]:null, text=t.t.replace(/\{n\}/g,n!=null?fmt(n):"");
    let mod=null;
    if(t.cat===B&&t.c&&!(t.m&&S.settings.watch)&&r()<0.4){mod=MODS[Math.floor(r()*MODS.length)];text+=" "+mod;}
    let xp=BASEXP[t.cat]*(1+0.15*tier)*(mod?1.15:1)*(t.n?1:1.05);
    const hidden=i===hiddenAt; if(hidden)xp*=2;
    const target=t.c?n*t.c:null;
    return{id:t.id,cat:t.cat,s:t.s,text,h:t.h||null,xp:Math.round(xp/5)*5,target,step:t.step||null,hidden,u:t.u||null,m:t.m||null,n};
  });
}
function ensureDay(){
  const k=dkey();
  if(S.today&&S.today.date===k)return false;
  if(S.today){ // vorige dag afsluiten
    const t=S.today;const done=t.chosen.filter(i=>t.done[i]).length;
    if(t.chosen.length)S.history.push({d:t.date,ids:t.chosen.map(i=>t.offer[i].id),done});
    S.history=S.history.slice(-60);
  }
  const yest=addDays(k,-1);
  const missed=S.lastPerfect!==yest&&S.lastPerfect!==k&&(S.streak>0||(S.today&&!S.today.perfect));
  if(missed){
    if(S.settings.penalty){
      const loss=Math.floor(S.xp*0.25);S.xp-=loss;
      const r=rng(hash(k+"straf"));
      S.penalty={mode:"hard",lost:S.streak,loss,date:k,quest:PENALTY[Math.floor(r()*PENALTY.length)],done:false,confirm:false};
      S.streak=0;
    }else if(S.streak>0){
      S.penalty={mode:"soft",lost:S.streak,date:k,done:true};
    }
  }
  S.today={date:k,offer:genOffer(k,0),sel:[],chosen:[],prog:{},done:{},rerolled:false,perfect:false,confirm:null};
  save();return true;
}

/* ===================== EXP & LEVELS ===================== */
let queue=[];
function gainXp(x){
  S.xp+=x;S.totalXp+=x;
  const before=rankIdx(S.level);
  while(S.xp>=needXp(S.level)){S.xp-=needXp(S.level);S.level++;S.free+=3;queue.push({type:"level",level:S.level});}
  const after=rankIdx(S.level);if(after>before)queue.push({type:"rank",r:after});
}
function checkTitles(){TITLES.forEach(t=>{if(!S.titles.includes(t.id)&&t.ok(S)){S.titles.push(t.id);queue.push({type:"title",t});if(!S.activeTitle)S.activeTitle=t.id;}});}
function streakMult(){return 1+Math.min(S.streak,10)*0.05;}
function complete(i){
  const t=S.today;if(t.done[i])return;
  const q=t.offer[i];t.done[i]=true;
  if(watchMet(q))q.verified=true;
  const x=Math.round(q.xp*streakMult());
  S.stats[q.s]+=q.hidden?2:1;
  S.counts[q.cat]++;S.totalDone++;if(q.hidden)S.hiddenDone++;
  S.recent.unshift({d:t.date,text:q.text,xp:x,cat:q.cat});S.recent=S.recent.slice(0,40);
  toast("+"+x+" EXP · +"+(q.hidden?2:1)+" "+STATS.find(s=>s.k===q.s).n);
  gainXp(x);
  checkPerfect();
  checkTitles();save();render();flush();
}
function penaltyOpen(){return S.penalty&&S.penalty.mode==="hard"&&!S.penalty.done&&S.penalty.date===S.today.date;}
function checkPerfect(){
  const t=S.today;
  if(t.perfect||t.chosen.length!==3||!t.chosen.every(c=>t.done[c]))return;
  if(penaltyOpen()){toast("Rond eerst de vloek af voor je dagbonus");return;}
  t.perfect=true;
  const cont=S.lastPerfect===addDays(t.date,-1)||(!S.settings.penalty&&S.streak>0);
  S.streak=cont?S.streak+1:1;
  S.lastPerfect=t.date;S.best=Math.max(S.best,S.streak);S.perfectDays++;
  // De Dungeon Master gooit een d20: 20 = natuurlijke 20 (×2,5), 1 = halve bonus
  const roll=1+Math.floor(Math.random()*20),base=50+10*Math.min(S.streak,10);
  const bonus=Math.round(base*(roll===20?2.5:roll===1?0.5:0.6+roll/25));
  if(roll===20)S.nat20=(S.nat20||0)+1;
  gateState().keys+=1;
  queue.push({type:"daily",bonus,roll});gainXp(bonus);
}

// Je neemt je ringen, stappen, kilometers en workouts over uit de Fitness-app of van je Watch.
function wd(){const w=S.watchData;return w&&w.date===dkey()?w:null;}
function wdEdit(){let w=wd();if(!w){w=S.watchData={date:dkey(),rm:0,re:0,rs:0,s:0,d:0,w:0};}return w;}
function watchVal(q){const w=wd();if(!w||!q.m)return 0;
  if(q.m==="rings")return (w.rm?1:0)+(w.re?1:0)+(w.rs?1:0);
  return +w[q.m]||0;}
function watchTarget(q){return q.m==="rings"?3:(q.m==="rm"||q.m==="re"||q.m==="rs")?1:(q.target||q.n||0);}
function watchMet(q){return !!(S.settings.watch&&q.m&&wd()&&watchVal(q)>=watchTarget(q));}
function watchReadyCount(){const t=S.today;if(!t)return 0;let n=t.chosen.filter(i=>!t.done[i]&&watchMet(t.offer[i])).length;const G=t.gate;if(G&&G.active&&watchMet(G.active))n++;return n;}
function watchProgress(q){if(!S.settings.watch||!q.m)return "";const v=watchVal(q),tg=watchTarget(q),w=wd();
  const ring=q.m==="rm"||q.m==="re"||q.m==="rs";
  const txt=!w?"Vul hierboven je Watch-stand in":ring?(v?"Ring gesloten":"Ring nog open"):q.m==="rings"?`${v} / 3 ringen`:`${q.m==="d"?v.toLocaleString("nl-NL",{maximumFractionDigits:1}):fmt(v)} / ${fmt(tg)} ${q.u||({s:"stappen",w:"workouts"})[q.m]||""}`;
  return `<div class="watch-prog"><div class="watch-row"><span>⌚ ${txt}</span>${w&&v>=tg?'<b>Gehaald</b>':""}</div>${w&&!ring?`<div class="bar wbar"><i style="width:${Math.min(100,v/tg*100)}%"></i></div>`:""}</div>`;}
function ringStreakCheck(){
  const w=wd();if(!w||!(w.rm&&w.re&&w.rs)||S.ringAwarded===dkey())return;
  S.ringStreak=(S.ringLast===addDays(dkey(),-1))?(S.ringStreak||0)+1:1;
  S.ringLast=dkey();S.ringAwarded=dkey();S.ringBest=Math.max(S.ringBest||0,S.ringStreak);
  const bonus=20+5*Math.min(S.ringStreak,10);
  queue.push({type:"rings",bonus,streak:S.ringStreak});gainXp(bonus);checkTitles();
}
function watchBar(){
  if(!S.settings.watch)return "";const w=wd()||{rm:0,re:0,rs:0,s:0,d:0,w:0};
  const ring=(k,lbl,cls)=>`<button class="ring-btn ${cls}${w[k]?" on":""}" data-act="wring" data-k="${k}" aria-pressed="${!!w[k]}"><span class="ring-dot"></span><span>${lbl}</span></button>`;

  return `<section class="win watch-win stack"><div class="today-head"><div><span class="sys-label">[ Apple Watch · vandaag ]</span><div class="small muted">Neem over uit de Fitness-app of van je Watch</div></div><div class="timer">Ringstreak<b style="color:var(--gold)">${rs}</b></div></div>
   <div class="rings">${ring("rm","Bewegen","r-move")}${ring("re","Trainen","r-ex")}${ring("rs","Staan","r-stand")}</div>

   </div></section>`;}
document.addEventListener("change",ev=>{const id=ev.target&&ev.target.id,map={"wq-s":"s","wq-d":"d"};if(map[id]){const w=wdEdit();let v=parseFloat(String(ev.target.value).replace(",","."))||0;w[map[id]]=map[id]==="d"?Math.round(Math.max(0,v)*10)/10:Math.max(0,Math.round(v));w.at=Date.now();save();render();const n=watchReadyCount();if(n)toast(`⌚ ${n} ${n===1?"quest is":"quests zijn"} klaar om te claimen`);}});

/* ===================== POORTEN ===================== */
// Na de 3 dagquests krijg je een kerkersleutel. Elke veroverde kerker geeft een nieuwe sleutel: je kunt eindeloos door.
const GATES={
 blauw:{n:"Kerker",c:"#6fa8ff",m:1,d:"Een gewone kerker met een extra quest."},
 paars:{n:"Crypte",c:"#a88cff",m:1.6,d:"Zeldzaam. Meer EXP."},
 rood:{n:"Drakenhol",c:"#e0564a",m:2.5,d:"Gevaarlijk en zwaarder. Je hebt 2 uur, anders stort het hol in en verlies je je combo."}
};
function gateState(){const t=S.today;if(!t.gate)t.gate={keys:0,combo:0,best:0,cleared:0,active:null,seed:0,used:[]};return t.gate;}
function gateMult(){return 1+0.1*Math.min(gateState().combo,10);}
function isOfficeDay(date){const [y,m,d]=date.split("-").map(Number);return S.settings.office!=null&&new Date(y,m-1,d).getDay()===S.settings.office;}
function openGate(slot){
  const t=S.today,G=gateState();if(!G.keys||G.active)return;
  G.seed++;const r=rng(hash(t.date+"|kerker|"+G.seed+"|"+slot+"|"+S.name));
  const red=Math.min(.08+G.combo*.04,.3),pur=Math.min(.25+G.combo*.05,.45),x=r();
  const rar=x<red?"rood":x<red+pur?"paars":"blauw";
  const cat=rar==="rood"&&r()<.6?B:[B,C,I,M,Y][Math.floor(r()*5)];
  const used=new Set([...t.offer.map(q=>q.id),...G.used]),office=isOfficeDay(t.date);
  let c=POOL.filter(q=>q.cat===cat&&!used.has(q.id)&&(!q.o||office)&&(!q.w||S.settings.watch));if(!c.length)c=POOL.filter(q=>q.cat===cat&&!q.o&&!q.w);
  const tp=c[Math.floor(r()*c.length)],base=tierOf(S.level),tier=Math.min(3,base+(rar==="blauw"?0:1));
  let n=tp.goal?Math.round(S.settings[tp.goal]*(rar==="blauw"?1:1.25)):tp.n?tp.n[tier]:null;if(rar==="rood"&&n&&base>=3&&!tp.goal)n=Math.round(n*1.25);
  const text=tp.t.replace(/\{n\}/g,n!=null?fmt(n):"");
  const xp=Math.round(BASEXP[tp.cat]*(1+0.15*base)*GATES[rar].m/5)*5;
  G.used.push(tp.id);G.keys--;
  G.active={id:tp.id,cat:tp.cat,s:tp.s,text,h:tp.h||null,xp,target:tp.c?n*tp.c:null,step:tp.step||null,m:tp.m||null,n,rar,prog:0,confirm:false,deadline:rar==="rood"?Date.now()+2*3600e3:null};
  queue.push({type:"gate",rar});save();render();flush();
}
function clearGate(){
  const G=gateState(),q=G.active;if(!q)return;
  const x=Math.round(q.xp*gateMult()*streakMult()),pts=q.rar==="rood"?2:1;
  S.stats[q.s]+=pts;S.counts[q.cat]++;S.totalDone++;

function dPoseAt(ex,time){
  if(ex.fn)return ex.fn((time/ex.per)%1);
  const tot=ex.d.reduce((a,b)=>a+b,0);let t=time%tot,i=0;while(t>ex.d[i]){t-=ex.d[i];i++;}
  return dlerp(ex.k[i],ex.k[(i+1)%ex.k.length],dease(Math.min(1,t/ex.d[i])));
}

let demo=null;
// Pixelweergave: de SVG-scène wordt op lage resolutie op een canvas getekend en scherp opgeschaald.
function pxDraw(svg){
  if(!demo||demo.busy)return;
  if(demo.fail){demo.el.innerHTML=svg;return;}
  const m=svg.match(/viewBox="([-\d. ]+)"/),vb=m?m[1].split(" ").map(Number):[0,0,240,240];
  const W=120,H=Math.round(W*vb[3]/vb[2]),cv=demo.cv;
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  const src=svg.replace("<svg ",`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" `);
  const img=new Image();demo.busy=true;
  img.onload=()=>{if(!demo)return;const x=cv.getContext("2d");x.imageSmoothingEnabled=false;x.clearRect(0,0,W,H);x.drawImage(img,0,0,W,H);demo.busy=false;};
  img.onerror=()=>{if(!demo)return;demo.fail=true;demo.busy=false;demo.el.innerHTML=svg;};
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(src);
}
function openDemo(ti){
  const tm=EXTERMS[+ti];if(!tm)return;const ex=EXD[tm[1]];if(!ex)return;
  const name=tm[2]||ex.n,cues=tm[3]||ex.c;
  closeDemo();
  const lay=document.createElement("div");lay.className="overlay ex-overlay";lay.setAttribute("role","dialog");lay.setAttribute("aria-label",name);
  lay.innerHTML=`<div class="win ex-win"><span class="sys-label">[ Oefening ]</span><h2>${esc(name)}</h2><div class="ex-stage" id="ex-stage"></div>
    <ul class="ex-cues">${cues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>
    <div class="actions"><button class="btn ghost" data-exspeed="1">${"Langzaam"}</button><button class="btn" data-exclose="1">Sluiten</button></div></div>`;
  document.body.appendChild(lay);
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  demo={ex,el:lay.querySelector("#ex-stage"),t0:performance.now(),speed:1,acc:0,last:performance.now(),reduce,raf:0,lay,drawn:0,busy:false,fail:false};
  demo.cv=document.createElement("canvas");demo.cv.className="ex-px";demo.cv.setAttribute("role","img");demo.cv.setAttribute("aria-label",name+", voorgedaan door je held");demo.el.appendChild(demo.cv);
  const stage=rankIdx(S.level);
  const tick=now=>{if(!demo)return;const dt=(now-demo.last)/1000;demo.last=now;demo.acc+=dt*demo.speed;
    let tt=demo.acc;if(demo.reduce&&!ex.fn){const tot=ex.d.reduce((a,b)=>a+b,0);const step=Math.floor(tt/1.4)%ex.k.length;let s=0;for(let i=0;i<step;i++)s+=ex.d[i];tt=s;}
    if(now-demo.drawn>=80){demo.drawn=now;pxDraw(dScene(ex,dPoseAt(ex,tt),S.look,stage,tt));}demo.raf=requestAnimationFrame(tick);};
  demo.raf=requestAnimationFrame(tick);
  lay.addEventListener("click",e=>{if(e.target===lay||e.target.closest("[data-exclose]")){closeDemo();return;}
    const sp=e.target.closest("[data-exspeed]");if(sp){demo.speed=demo.speed===1?0.45:1;sp.textContent=demo.speed===1?"Langzaam":"Normaal tempo";}});
  setTimeout(()=>{const b=lay.querySelector("[data-exclose]");if(b)b.focus();},50);
}
function closeDemo(){if(demo){cancelAnimationFrame(demo.raf);demo.lay.remove();demo=null;}}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&demo){closeDemo();return;}const t=e.target&&e.target.closest&&e.target.closest(".ex-term");if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openDemo(t.dataset.ex);}});
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest(".ex-term");if(t){e.preventDefault();e.stopPropagation();openDemo(t.dataset.ex);}},true);

function hud(){

  return `<section class="win hud" style="--rank:${R.col}">
   <div class="rank-badge"><span>${R.r}</span></div>

    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${need}" aria-valuenow="${S.xp}"><i style="width:${pct}%"></i></div>

function timeLeft(){const n=new Date(),m=new Date(n);m.setHours(24,0,0,0);const s=Math.max(0,(m-n)/1000|0);return pad(s/3600|0)+":"+pad((s%3600)/60|0)+":"+pad(s%60);}

   <button class="btn ghost" data-act="name">Naam opslaan</button>
   <div class="field"><label for="bk">Back-upcode</label><textarea id="bk" placeholder="Plak hier een back-upcode om je voortgang terug te zetten"></textarea></div>
   <div class="actions"><button class="btn ghost" data-act="exp">Kopieer back-up</button><button class="btn ghost" data-act="imp">Herstel</button></div>
   <p class="muted small" style="margin:0">Op je beginscherm zetten: open deze pagina in Safari, tik op Deel en kies <b>Zet op beginscherm</b>.</p>
   <p class="muted small" style="margin:0" id="syncinfo">Je voortgang staat alleen op deze telefoon, niet in de cloud. Maak af en toe een back-up en bewaar de code in je notities.</p>
   <button class="btn danger" data-act="reset">${resetArm?"Tik nogmaals: alles wissen":"Begin opnieuw"}</button>
   <p class="muted small" style="margin:0;text-align:center">Level Up: Dungeon Master · versie 1.0</p></section>`;
  return h;
}
let resetArm=false;
let draft=null,pStage=0,firstLook=false;
const NUMK=["hairCol","skin","eyes","outCol"];
function createView(){
  const L=draft,R=RANKS[pStage];
  const grp=(title,key,items)=>`<div class="field"><label>${title}</label><div class="opts">${items.map(it=>{const on=String(L[key])===String(it.v);
    return it.label?`<button class="opt${on?" on":""}" data-act="look" data-k="${key}" data-v="${it.v}" aria-pressed="${on}">${it.sw?`<i style="background:${it.sw};color:${it.sw}"></i>`:""}${esc(it.label)}</button>`
    :`<button class="swatch${on?" on":""}" style="background:${it.sw}" data-act="look" data-k="${key}" data-v="${it.v}" aria-pressed="${on}" aria-label="${title} ${+it.v+1}"></button>`;}).join("")}</div></div>`;
  let h=`<div><span class="sys-label">[ DM · ${firstLook?"Nieuw avontuur":"Uiterlijk"} ]</span><h2>${firstLook?"Kies je held":"Pas je held aan"}</h2><p class="muted small" style="margin:4px 0 0">Je begint als rekruut in de herberg. Elke rang geeft je betere uitrusting en een nieuw decor, tot je als legende op de drakentop staat. Tik op een rang om de evolutie te bekijken.</p></div>`;
  h+=`<section class="win stack" style="--rank:${R.col}"><div class="avatar-wrap">${avatarSVG(L,pStage,null,{anim:true,label:R.name})}</div>
    <p class="evo-label"><b style="color:${R.col}">${R.name}</b><br><span class="muted">${R.gear}</span></p>
    <div class="evo">${RANKS.map((r,i)=>`<button class="evo-step${i===pStage?" on":""}" data-act="pstage" data-v="${i}" aria-label="Bekijk ${r.name}">${avatarSVG(L,i,null,{mini:true,label:r.name})}<span>${r.r}</span></button>`).join("")}</div></section>`;
  h+=`<section class="win stack">`;
  h+=grp("Klasse","element",LOOK_OPTS.element.map(e=>({v:e.k,label:e.n,sw:e.c})));
  h+=grp("Haarstijl","hair",LOOK_OPTS.hair.map(x=>({v:x.k,label:x.n})));
  h+=grp("Haarkleur","hairCol",LOOK_OPTS.hairCol.map((c,i)=>({v:i,sw:c})));
  h+=grp("Huidskleur","skin",LOOK_OPTS.skin.map((c,i)=>({v:i,sw:c})));
  h+=grp("Oogkleur","eyes",LOOK_OPTS.eyes.map((c,i)=>({v:i,sw:c})));
  h+=grp("Kleding","outfit",LOOK_OPTS.outfit.map(x=>({v:x.k,label:x.n})));
  h+=grp("Kledingkleur","outCol",LOOK_OPTS.outCol.map((c,i)=>({v:i,sw:c})));
  h+=`<div class="field"><label for="cnm">Naam van je held</label><input type="text" id="cnm" maxlength="20" value="${esc(S.name)}"></div>`;
  h+=`<div class="actions">${firstLook?"":`<button class="btn ghost" data-act="lookcancel">Annuleer</button>`}<button class="btn" data-act="lookok">${firstLook?"Begin":"Opslaan"}</button></div></section>`;
  return h;
}
function openCreator(first){firstLook=!!first;draft=Object.assign({},DEFAULT_LOOK,S.look||{});pStage=first?0:rankIdx(S.level);tab="create";render();window.scrollTo(0,0);}
function render(){
  const app=$("#app");
  app.innerHTML=tab==="create"?createView():tab==="quests"?questsView():tab==="hunter"?hunterView():logView();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  const t=S.today,wr=S.settings.watch?watchReadyCount():0,open=wr?"⌚":t?(t.chosen.length<3?1:t.chosen.filter(i=>!t.done[i]).length||(t.gate&&t.gate.keys&&!t.gate.active?"!":0)):0;
  const bq=$("#badge-q");open?bq.setAttribute("data-n",open):bq.removeAttribute("data-n");
  const bh=$("#badge-h");S.free?bh.setAttribute("data-n",S.free):bh.removeAttribute("data-n");
}

/* ===================== OVERLAYS ===================== */
let showing=false;
function flush(){
  if(showing||!queue.length)return;
  // Meerdere level-ups samenvoegen
  let e=queue.shift();
  while(e.type==="level"&&queue[0]&&queue[0].type==="level")e=queue.shift();
  showing=true;let inner="";
  if(e.type==="level")inner=`<span class="sys-label">[ Dungeon Master ]</span><div class="big">LEVEL ${e.level}</div><p style="margin:0">Je held is sterker geworden.<br><b style="color:var(--gold)">+3 vrije statpunten</b></p>`;
  if(e.type==="rank"){const R=RANKS[e.r];inner=`<span class="sys-label">[ DM · Herbeoordeling ]</span><div class="big" style="color:${R.col};text-shadow:0 0 18px ${R.col}">${R.r}-RANG</div><p style="margin:0">Je bent opnieuw beoordeeld.<br>Nieuw ontgrendeld: <b>${R.gear}</b></p>`;}
  if(e.type==="daily")inner=`<span class="sys-label">[ Dungeon Master · d20 ]</span><div class="d20${e.roll===20?" nat":e.roll===1?" one":""}">${e.roll||"?"}</div><div class="big gold">QUEST VOLTOOID</div><p style="margin:0">${e.roll===20?"<b style=\"color:var(--ok)\">Natuurlijke 20! Dubbel en dwars.</b><br>":e.roll===1?"<b style=\"color:var(--red)\">Een 1… de dobbelsteen was je niet gunstig.</b><br>":"Je gooit "+e.roll+" op de d20.<br>"}Dagbonus <b style="color:var(--gold)">+${e.bonus} EXP</b><br>Streak: ${S.streak} ${S.streak===1?"dag":"dagen"}<br><b style="color:var(--line)">Kerkersleutel ontvangen</b></p>`;
  if(e.type==="gate"){const g=GATES[e.rar];inner=`<span class="sys-label">[ DM · Kerker geopend ]</span><div class="big" style="color:${g.c};text-shadow:0 0 18px ${g.c};font-size:34px">${g.n.toUpperCase()}</div><p style="margin:0">${g.d}</p>`;}
  if(e.type==="cleared"){const g=GATES[e.rar];inner=`<span class="sys-label">[ Dungeon Master ]</span><div class="big" style="color:${g.c};text-shadow:0 0 18px ${g.c};font-size:32px">KERKER VEROVERD</div><p style="margin:0"><b style="color:var(--gold)">+${e.x} EXP</b> · combo ${e.combo}<br>Je krijgt een nieuwe kerkersleutel.</p>`;}
  if(e.type==="rings")inner=`<span class="sys-label">[ DM · Ringen ]</span><div class="big" style="color:#ff375f;text-shadow:0 0 18px #ff375f;font-size:34px">ALLE RINGEN DICHT</div><p style="margin:0">Ringstreak: <b style="color:var(--gold)">${e.streak} ${e.streak===1?"dag":"dagen"}</b><br>Bonus <b style="color:var(--gold)">+${e.bonus} EXP</b></p>`;
  if(e.type==="title")inner=`<span class="sys-label">[ DM · Titel ]</span><div class="big gold" style="font-size:30px">« ${esc(e.t.n)} »</div><p style="margin:0">${esc(e.t.d)}</p>`;
  $("#layer").innerHTML=`<div class="overlay" data-act="close"><div class="win">${inner}<button class="btn" data-act="close">OK</button></div></div>`;
}
let toastT;
function toast(msg){clearTimeout(toastT);let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);}el.textContent=msg;toastT=setTimeout(()=>el.remove(),2200);}

/* ===================== INTERACTIE ===================== */
document.addEventListener("click",ev=>{
  const tb=ev.target.closest(".tab");if(tb){if(firstLook&&!S.look){toast("Kies eerst je held");return;}tab=tb.dataset.tab;resetArm=false;render();window.scrollTo(0,0);return;}
  const el=ev.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,t=S.today,i=+el.dataset.i;
  if(a==="close"){if(ev.target!==el&&el.classList.contains("overlay"))return;$("#layer").innerHTML="";showing=false;flush();return;}
  if(a==="sel"){const p=t.sel.indexOf(i);if(p>-1)t.sel.splice(p,1);else if(t.sel.length<3)t.sel.push(i);else{toast("Je kunt er maar 3 kiezen");return;}save();render();return;}
  if(a==="reroll"){if(t.rerolled)return;t.offer=genOffer(t.date,1);t.sel=[];t.rerolled=true;save();render();toast("De Dungeon Master schudt de kaarten opnieuw");return;}
  if(a==="accept"){if(t.sel.length!==3)return;t.chosen=[...t.sel].sort((x,y)=>x-y);save();render();window.scrollTo(0,0);toast("Quests geaccepteerd. Moge de dobbelsteen je gunstig zijn.");return;}
  if(a==="cnt"){const q=t.offer[i];t.prog[i]=Math.max(0,Math.min(q.target,(t.prog[i]||0)+(+el.dataset.v)));save();render();return;}
  if(a==="done"){const q=t.offer[i];if(!q.target&&!watchMet(q)&&t.confirm!==i){t.confirm=i;render();return;}t.confirm=null;complete(i);return;}
  if(a==="pt"){if(!S.free)return;S.free--;S.stats[el.dataset.k]++;save();render();return;}
  if(a==="title"){S.activeTitle=el.dataset.t;save();render();return;}
  if(a==="whint"){S.watchHintOff=true;save();render();toast("Je vindt de Watch-koppeling altijd onder Logboek");return;}
  if(a==="wgo"){tab="log";render();const w=$("#watch-settings");if(w)w.scrollIntoView({behavior:"smooth",block:"start"});return;}
  if(a==="wtoggle"){S.settings.watch=!S.settings.watch;if(t&&!t.chosen.length){t.offer=genOffer(t.date,t.rerolled?1:0);t.sel=[];}save();render();toast(S.settings.watch?"Watch-quests aan. Vul bovenaan je ringen en stappen in.":"Watch-quests uit. Alles werkt gewoon zonder.");if(S.settings.watch&&tab!=="quests"){tab="quests";render();window.scrollTo(0,0);}return;}
  if(a==="wring"){const w=wdEdit(),k=el.dataset.k;w[k]=w[k]?0:1;w.at=Date.now();ringStreakCheck();save();render();flush();return;}
  if(a==="wwk"){const w=wdEdit();w.w=Math.max(0,(w.w||0)+(+el.dataset.v));w.at=Date.now();save();render();return;}
  if(a==="gopen"){openGate(i);return;}
  if(a==="gcnt"){const q=gateState().active;if(!q)return;q.prog=Math.max(0,Math.min(q.target,q.prog+(+el.dataset.v)));save();render();return;}
  if(a==="gdone"){const q=gateState().active;if(!q)return;if(!q.target&&!watchMet(q)&&!q.confirm){q.confirm=true;render();return;}clearGate();return;}
  if(a==="gquit"){abandonGate();return;}
  if(a==="look"){const k=el.dataset.k;draft[k]=NUMK.includes(k)?+el.dataset.v:el.dataset.v;render();return;}
  if(a==="pstage"){pStage=+el.dataset.v;render();return;}
  if(a==="editlook"){openCreator(false);return;}
  if(a==="lookcancel"){tab="hunter";render();return;}
  if(a==="lookok"){const v=($("#cnm").value||"").trim().slice(0,20);if(v)S.name=v;S.look=Object.assign({},draft);const f=firstLook;firstLook=false;save();tab=f?"quests":"hunter";render();window.scrollTo(0,0);toast(f?"Je bent ontwaakt, "+S.name:"Uiterlijk opgeslagen");return;}
  if(a==="ackpen"){S.penalty.ack=true;save();render();return;}
  if(a==="pendone"){const P=S.penalty;if(!P.confirm){P.confirm=true;render();return;}P.done=true;P.confirm=false;toast("Straf voldaan");checkPerfect();checkTitles();save();render();flush();return;}
  if(a==="pmode"){S.settings.penalty=!S.settings.penalty;if(!S.settings.penalty&&S.penalty&&S.penalty.mode==="hard"&&!S.penalty.done){S.penalty.done=true;S.penalty.ack=true;checkPerfect();}save();render();toast(S.settings.penalty?"Vloekmodus aan":"Vloekmodus uit: je streak bevriest bij een gemiste dag");flush();return;}
  if(a==="office"){const v=el.dataset.v;S.settings.office=v===""?null:+v;if(t&&!t.chosen.length){t.offer=genOffer(t.date,t.rerolled?1:0);t.sel=[];}save();render();toast("Kantoordag opgeslagen");return;}
  if(a==="name"){const v=$("#nm").value.trim().slice(0,20);if(v){S.name=v;save();render();toast("Naam opgeslagen");}return;}
  if(a==="exp"){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const ta=$("#bk");ta.value=code;
    const done=()=>toast("Back-upcode gekopieerd");
    try{navigator.clipboard.writeText(code).then(done,()=>{ta.select();toast("Selecteer en kopieer de code hierboven");});}catch(e){ta.select();toast("Selecteer en kopieer de code hierboven");}return;}
  if(a==="imp"){try{const o=JSON.parse(decodeURIComponent(escape(atob($("#bk").value.trim()))));if(!o||!o.stats||!o.level)throw 0;adopt(o);ensureDay();save();render();toast("Voortgang hersteld");}catch(e){toast("Deze code klopt niet. Plak de volledige back-upcode.");}return;}
  if(a==="reset"){if(!resetArm){resetArm=true;render();return;}resetArm=false;S=fresh();ensureDay();save();tab="quests";render();toast("Nieuw begin");return;}
});

/* ===================== LOKALE OPSLAG ===================== */
// Alles blijft op dit toestel. Vraag het systeem de opslag niet op te ruimen.
async function initCloud(){try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(e){}}

/* ===================== START ===================== */
function upgrade(){if(S.today&&S.today.perfect&&!S.today.gate)gateState().keys=1;if(S.poolV!==2){S.poolV=2;if(S.today&&!S.today.chosen.length){S.today.offer=genOffer(S.today.date,S.today.rerolled?1:0);S.today.sel=[];}}}
function adopt(o){S=migrate(Object.assign(fresh(),{poolV:1},o));upgrade();}
upgrade();ensureDay();save();render();if(!S.look)openCreator(true);
setInterval(()=>{const tm=$("#timer");if(tm)tm.textContent=timeLeft();if(ensureDay()){render();return;}const G=S.today&&S.today.gate,q=G&&G.active;if(q&&q.deadline){if(Date.now()>q.deadline)abandonGate("tijd");else{const gt=$("#gtimer");if(gt)gt.textContent=gateTimeLeft(q);}}},1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ensureDay())render();});
initCloud();
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
